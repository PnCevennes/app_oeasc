# Configuration oeasc
# Le build Vite (frontend/vite.config.js) sert l'app sous /front/ en production,
# l'API reste exposée sous /oeasc/api (proxy vers gunicorn)
# /PATH/TO/app_oeasc est à remplacer par le chemin réel de l'installation sur le serveur
Alias /front /PATH/TO/app_oeasc/frontend/dist
<Directory /PATH/TO/app_oeasc/frontend/dist>
Require all granted
# URLs propres (mode history de vue-router) : tout chemin qui n'est pas un fichier du build
# (/front/observatoire/presentation, ...) renvoie index.html, la SPA gère ensuite la route
FallbackResource /front/index.html
</Directory>
# SEO : sitemap.xml et robots.txt générés par Flask (voir install/docs/seo.md).
# Le sitemap doit être sous /front/ pour pouvoir lister les pages du site ; robots.txt doit être
# à la racine du domaine (à retirer si le domaine en fournit déjà un).
ProxyPass /front/sitemap.xml http://127.0.0.1:5005/seo/sitemap.xml
ProxyPass /robots.txt http://127.0.0.1:5005/seo/robots.txt
<Location /oeasc/api>
ProxyPass http://127.0.0.1:5005
ProxyPassReverse  http://127.0.0.1:5005
</Location>
#FIN Configuration oeasc
