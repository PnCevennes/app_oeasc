# Configuration oeasc
# Le build Vite (frontend/vite.config.js) sert l'app sous /front/ en production,
# l'API reste exposée sous /oeasc/api (proxy vers gunicorn)
# /PATH/TO/app_oeasc est à remplacer par le chemin réel de l'installation sur le serveur
Alias /front /PATH/TO/app_oeasc/frontend/dist
<Directory /PATH/TO/app_oeasc/frontend/dist>
Require all granted
</Directory>
<Location /oeasc/api>
ProxyPass http://127.0.0.1:5005
ProxyPassReverse  http://127.0.0.1:5005
</Location>
#FIN Configuration oeasc
